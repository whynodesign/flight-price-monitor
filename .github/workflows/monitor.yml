name: Flight Price Monitor

on:
  schedule:
    # 每小时整点运行一次
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Build config (multi-route)
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          cat > config.yaml <<EOF
          routes:
            - from: SZX
              from_name: 深圳
              to: DZH
              to_name: 达州
              dates:
                - "2026-10-02"
                - "2026-10-03"
                - "2026-10-04"
              alert_threshold: 579

            - from: SZX
              from_name: 深圳
              to: CTU
              to_name: 成都
              dates:
                - "2026-10-02"
                - "2026-10-03"
                - "2026-10-04"
              alert_threshold: 579

          platforms:
            - fliggy
            - qunar
            - tongcheng

          schedule:
            interval_minutes: 999
            jitter_minutes: 0
            run_on_start: true

          crawler:
            headless: true
            timeout_seconds: 45
            delay_min: 5
            delay_max: 15
            user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
            mobile_user_agent: ""
            debug: false
            debug_dir: debug
            user_data_dir: user_data

          output:
            db_path: data/prices.db
            log_path: logs/monitor.log

          notifier:
            push_drop_min: 30
            push_rise_min: 50
            serverchan:
              enabled: true
              send_key: "${SERVERCHAN_KEY}"
              channel: ""
          EOF
          echo "--- routes in generated config ---"
          grep -E 'from:|to:|alert_threshold:' config.yaml

      - name: Run price monitor (one round)
        run: python main.py --once
        timeout-minutes: 25

      - name: Export latest results to JSON
        run: |
          mkdir -p docs/data
          python scripts/export_results.py \
            --db data/prices.db \
            --out docs/data/latest.json

      - name: Render HTML report
        run: |
          python scripts/render_report.py \
            --results-file docs/data/latest.json \
            --out-dir docs/data

      - name: Commit data & report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "chore: update price data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
